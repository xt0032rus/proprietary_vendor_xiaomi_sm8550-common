# Sensor Notifier Configuration
# =============================

# Logging Settings
# -----------------
# Log level: VERBOSE, DEBUG, INFO, WARNING, ERROR
log_level = ERROR

# Polling Settings  
# -----------------
# Poll timeout in milliseconds
poll_timeout_ms = 5000

# Error Handling
# --------------
# Maximum consecutive errors before giving up
max_consecutive_errors = 5
# Delay between error retries in milliseconds
error_retry_delay_ms = 1000

# Heartbeat Settings
# ------------------
# Heartbeat interval in seconds
heartbeat_interval_sec = 60

# Component Settings
# ------------------
# Enable/disable notifiers
enable_aod_notifier = true
enable_non_ui_notifier = true

# Sensor Parameters
# -----------------
# Sensor sampling period in microseconds
sensor_sample_period = 20000
# Sensor latency in microseconds  
sensor_latency = 0

# Health Monitoring
# -----------------
# Health check interval in seconds
health_check_interval_sec = 30
# Component timeout in seconds
component_timeout_sec = 45
# Maximum restart attempts before giving up
max_restart_attempts = 5

# Recovery Settings
# -----------------
# Delay between recovery attempts in milliseconds
recovery_retry_delay_ms = 200
# Enable automatic recovery of unhealthy components
enable_auto_recovery = true

# Device Paths
# ------------
# Touch device path
touch_device_path = /dev/xiaomi-touch
# Display device path  
display_device_path = /dev/mi_display/disp_feature